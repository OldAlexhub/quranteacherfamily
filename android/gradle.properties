org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true
# Android 16 enforces edge-to-edge. Keep it enabled on older supported
# versions as well so the same inset behavior is exercised everywhere.
edgeToEdgeEnabled=true
